name: Build BleedingEdgeBazzite

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
  repository_dispatch:
    types: [akmods_updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Jeden build BEB naraz: push i dispatch z Fabryki nie budują równolegle i nie ścigają się o :latest.
# Trwającego builda nie przerywamy (publikuje obraz) — kolejny czeka w kolejce.
concurrency:
  group: beb-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Fedora version
        id: fedora
        env:
          # Payload dispatchu przekazujemy przez env (nie inline w skrypcie) i walidujemy: to zewnętrzne dane.
          PAYLOAD_FEDORA: ${{ github.event.client_payload.fedora_version }}
        run: |
          # Z dispatcha Fabryki lub fallback do najnowszej Fedory, dla której Bazzite publikuje
          # stabilny obraz bazowy (stable-<Fedora>). Brak tagu ("manifest unknown") = niższa Fedora;
          # każdy inny błąd skopeo przerywa (bez cichego cofania wersji).
          FEDORA_VERSION="$PAYLOAD_FEDORA"
          if [ -n "$FEDORA_VERSION" ] && ! [[ "$FEDORA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Niepoprawna wersja Fedory w payloadzie dispatchu (oczekiwano liczby)"
            exit 1
          fi
          if [ -z "$FEDORA_VERSION" ]; then
            command -v skopeo >/dev/null || sudo apt-get install -y -q skopeo 2>&1 | tail -1
            SKOPEO_ERR=$(mktemp)
            for v in $(curl -sL https://dl.fedoraproject.org/pub/fedora/linux/releases/ \
                | grep -oE 'href="[0-9]+/"' | grep -oE '[0-9]+' | sort -rn); do
              if skopeo inspect --no-creds \
                  "docker://ghcr.io/ublue-os/bazzite-deck-nvidia:stable-${v}" >/dev/null 2>"$SKOPEO_ERR"; then
                FEDORA_VERSION=$v
                break
              fi
              if ! grep -q 'manifest unknown' "$SKOPEO_ERR"; then
                echo "::error::skopeo inspect stable-${v} zwrócił nieoczekiwany błąd:"
                cat "$SKOPEO_ERR"
                exit 1
              fi
              echo "Bazzite nie publikuje jeszcze stable-${v} — próbuję niższą Fedorę..."
            done
          fi
          if [ -z "$FEDORA_VERSION" ]; then
            echo "::error::Nie znaleziono Fedory z obrazem Bazzite stable-<wersja>"
            exit 1
          fi
          echo "fedora_version=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Używam Fedory: $FEDORA_VERSION"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Get latest Antigravity URLs
        id: antigravity-urls
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium
          output=$(node scripts/get-antigravity-urls.mjs)
          echo "$output"
          echo "antigravity_url=$(echo "$output" | grep ^ANTIGRAVITY_URL= | cut -d= -f2-)" >> $GITHUB_OUTPUT
          echo "antigravity_ide_url=$(echo "$output" | grep ^ANTIGRAVITY_IDE_URL= | cut -d= -f2-)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # Obraz publikujemy tylko z main; run z innej gałęzi robi pełny build bez push i bez dispatchu ISO.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vyzygota/bleedingedgebazzite:latest
          provenance: false
          build-args: |
            FEDORA_VERSION=${{ steps.fedora.outputs.fedora_version }}
            ANTIGRAVITY_URL=${{ steps.antigravity-urls.outputs.antigravity_url }}
            ANTIGRAVITY_IDE_URL=${{ steps.antigravity-urls.outputs.antigravity_ide_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ISO rebuild
        if: success() && github.ref == 'refs/heads/main'
        env:
          BEB_TOKEN: ${{ secrets.BEB_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $BEB_TOKEN" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d '{"event_type":"beb_built"}')
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "::error::Dispatch beb_built nie powiódł się — HTTP $HTTP_STATUS. Sprawdź secret BEB_DISPATCH_TOKEN."
            exit 1
          fi
          echo "✅ Dispatch beb_built wysłany — ISO zostanie odbudowane."
