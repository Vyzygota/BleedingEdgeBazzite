name: Build BleedingEdgeBazzite

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
  repository_dispatch:
    types: [akmods_updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Fedora version
        id: fedora
        run: |
          # Z dispatcha Fabryki lub fallback do najnowszej stabilnej Fedory
          FEDORA_VERSION="${{ github.event.client_payload.fedora_version }}"
          if [ -z "$FEDORA_VERSION" ]; then
            FEDORA_VERSION=$(curl -sL https://dl.fedoraproject.org/pub/fedora/linux/releases/ \
              | grep -oE 'href="[0-9]+/"' | grep -oE '[0-9]+' | sort -rn | head -1)
          fi
          echo "fedora_version=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Używam Fedory: $FEDORA_VERSION"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Get latest Antigravity URLs
        id: antigravity-urls
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium
          output=$(node scripts/get-antigravity-urls.mjs)
          echo "$output"
          echo "antigravity_url=$(echo "$output" | grep ^ANTIGRAVITY_URL= | cut -d= -f2-)" >> $GITHUB_OUTPUT
          echo "antigravity_ide_url=$(echo "$output" | grep ^ANTIGRAVITY_IDE_URL= | cut -d= -f2-)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ghcr.io/vyzygota/bleedingedgebazzite:latest
          provenance: false
          build-args: |
            FEDORA_VERSION=${{ steps.fedora.outputs.fedora_version }}
            ANTIGRAVITY_URL=${{ steps.antigravity-urls.outputs.antigravity_url }}
            ANTIGRAVITY_IDE_URL=${{ steps.antigravity-urls.outputs.antigravity_ide_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ISO rebuild
        if: success()
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.BEB_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"beb_built"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
