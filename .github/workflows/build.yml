name: Build BleedingEdgeBazzite

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [akmods_updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Fedora version
        id: fedora
        run: |
          # Z dispatcha Fabryki lub fallback do najnowszej stabilnej Fedory
          FEDORA_VERSION="${{ github.event.client_payload.fedora_version }}"
          if [ -z "$FEDORA_VERSION" ]; then
            FEDORA_VERSION=$(curl -sL https://dl.fedoraproject.org/pub/fedora/linux/releases/ \
              | grep -oE 'href="[0-9]+/"' | grep -oE '[0-9]+' | sort -rn | head -1)
          fi
          echo "fedora_version=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Używam Fedory: $FEDORA_VERSION"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ghcr.io/vyzygota/bleedingedgebazzite:latest
          provenance: false
          build-args: |
            FEDORA_VERSION=${{ steps.fedora.outputs.fedora_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
