name: Build BleedingEdgeBazzite Installer ISO

on:
  workflow_dispatch:
  repository_dispatch:
    types: [beb_built]

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lorax
        run: dnf install -y lorax wget

      - name: Download Fedora 44 netinstall ISO
        run: |
          for BASE in \
            "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso" \
            "https://dl.fedoraproject.org/pub/fedora/linux/development/44/Everything/x86_64/iso"; do
            FILENAME=$(curl -s "$BASE/" | grep -oP 'Fedora-Everything-netinst-x86_64-44[^"]+\.iso' | head -1)
            if [ -n "$FILENAME" ]; then
              echo "Pobieranie: $BASE/$FILENAME"
              wget -q "$BASE/$FILENAME" -O netinstall.iso
              break
            fi
          done
          [ -s netinstall.iso ] || { echo "Nie znaleziono ISO Fedory 44"; exit 1; }

      - name: Inject kickstart
        run: mkksiso --ks installer/beb.ks netinstall.iso BEB-installer.iso

      - name: Create or update release and upload ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: BleedingEdgeBazzite Installer ISO
          body: |
            Netinstall ISO — pobiera obraz z GHCR podczas instalacji.
            Wymagane połączenie z internetem.
          files: BEB-installer.iso
